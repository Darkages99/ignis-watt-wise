<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f7" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>IGNIS · Watt-Wise — Energy from Everyday Activity</title>
    <meta
      name="description"
      content="A presenter guide for IGNIS Watt-Wise: catching wasted energy from the road and from footsteps with two piezoelectric systems."
    />
  </head>
  <body>
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <div id="preloader" aria-hidden="true">
      <div class="preloader__mark">IGNIS</div>
      <div class="preloader__bar"><span></span></div>
      <div class="preloader__pct">0</div>
    </div>

    <div id="progress-rail" aria-hidden="true"><span id="progress-fill"></span></div>
    <div id="slide-counter" aria-hidden="true"><b>01</b> / 11</div>
    <nav id="chapter-nav" aria-label="Chapters"></nav>

    <!-- Presenter guide -->
    <aside id="presenter" aria-label="Presenter notes">
      <div class="presenter__top">
        <span class="presenter__badge">Presenter</span>
        <span class="presenter__slidename"></span>
        <button id="presenter-close" aria-label="Hide presenter notes">&times;</button>
      </div>
      <ul class="presenter__notes"></ul>
      <div class="presenter__hint">Tap <kbd>&times;</kbd> or press <kbd>N</kbd> to hide · <kbd>↑</kbd><kbd>↓</kbd> to move between slides</div>
    </aside>
    <button id="presenter-toggle" aria-label="Show presenter notes">N</button>

    <main id="app"></main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
